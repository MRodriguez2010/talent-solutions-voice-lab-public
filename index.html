<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Lab | Employee Sentiment Analysis</title>
<style>body{font:17px system-ui;color:#223740;background:#f6f6f2;max-width:55rem;margin:3rem auto;padding:1rem}article{padding:1rem;border-top:1px solid #acb9b8}button{font:inherit;padding:.4rem .8rem}a{color:#215548}</style>
<h1>Employee Sentiment Analysis</h1><p>Review the fictional Alder Works topic comparisons and choose which evidence belongs in the brief.</p>
<p><a href="/historical-benchmark.pptx">Download the Caliber Collision historical benchmark (February 2026)</a></p><main></main><p id="status" role="status"></p><a id="export" href="/brief.pptx">Download reviewed slides</a>
<script>
async function render(){
 const rows=await(await fetch('/topics')).json(), main=document.querySelector('main');main.replaceChildren();
 document.querySelector('#export').hidden=!rows.some(r=>r.included);
 for(const r of rows){
  const card=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),b=document.createElement('button');
  h.textContent=r.topic;p.textContent='Focus: '+r.focus_yes+' / '+r.focus_total+' favorable. Peers: '+r.peer_yes+' / '+r.peer_total+'. Difference: '+r.gap_pp+' percentage points.';
  b.textContent=r.included?'Remove from brief':'Approve for brief'; b.onclick=async()=>{let resp=await fetch('/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:r.topic,include:!r.included})});if(resp.ok)await render();else document.querySelector('#status').textContent='Review could not be saved.'};
  card.append(h,p,b);main.append(card)
 }
}render();
</script></html>
